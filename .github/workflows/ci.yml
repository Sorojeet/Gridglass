name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# If your project files are inside a "gridglass" folder, uncomment the next 3 lines:
# defaults:
#   run:
#     working-directory: gridglass

jobs:
  unit:
    name: Unit & API tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      - run: pytest -m "not e2e" --cov=gridglass --cov-report=term-missing

  e2e:
    name: End-to-end (phone browsers)
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e ".[dev]"
      - run: python -m playwright install --with-deps chromium
      - run: pytest -m e2e

  docker:
    name: Docker image (build, run, browser-test)
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t gridglass:ci .
      - name: Start the container
        run: |
          docker run -d --name gg -p 8000:8000 \
            -e RATE_LIMIT_UPLOADS="1000 per minute" -e RATE_LIMIT_EXPORTS="1000 per minute" gridglass:ci
          for i in $(seq 30); do curl -fs localhost:8000/healthz && break; sleep 1; done
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e ".[dev]"
      - run: python -m playwright install --with-deps chromium
      - name: Browser tests against the container
        run: E2E_BASE_URL=http://127.0.0.1:8000 pytest -m e2e
      - name: Container logs
        if: always()
        run: docker logs gg
