# Render Blueprint: New → Blueprint → pick this repo. Deploys the Dockerfile with health checks.
services:
  - type: web
    name: gridglass
    runtime: docker
    plan: starter            # "free" also works (it sleeps when idle)
    region: singapore        # closest to India
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: TRUST_PROXY
        value: "1"
      - key: WEB_CONCURRENCY
        value: "2"
      - key: MAX_UPLOAD_MB
        value: "100"
      - key: CANONICAL_HOST      # main address: www and onrender.com redirect here
        value: gridglass.in
      - key: ADSENSE_CLIENT      # ca-pub-…, set in the dashboard once AdSense gives it to you
        sync: false
