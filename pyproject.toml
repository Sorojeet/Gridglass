[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "gridglass"
version = "1.4.1"
description = "Simple spreadsheet tools for everyone — clean, reshape and convert CSV and spreadsheet files."
requires-python = ">=3.11"
dependencies = [
    "flask>=3.1,<4",
    "polars>=2.1,<3",
    "fastexcel>=0.21",       # fast Excel reading (calamine) for polars.read_excel
    "xlsxwriter>=3.2",       # Excel export
    "pydantic>=2.9,<3",      # step validation
    "reportlab>=4.2",        # PDF export
    "uharfbuzz>=0.40",       # text shaping for Hindi and other Indic scripts in PDFs
    "flask-limiter>=3.8",    # per-IP rate limits
    "gunicorn>=23",          # production server
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "playwright>=1.48"]

[tool.setuptools.packages.find]
include = ["gridglass*"]

[tool.setuptools.package-data]
gridglass = ["static/**/*", "engine/fonts/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["e2e: browser tests (need `playwright install chromium`)"]
